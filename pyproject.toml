[project]
name = "wvdump"
version = "0.1.0"
description = "Extract Widevine L3 device identity and content keys from Android via Frida"
requires-python = ">=3.11"
dependencies = [
    "frida==17.17.0",
    "pywidevine>=1.8",
    "httpx>=0.27",
    "adbutils>=2.5",
]

[project.scripts]
wvdump = "wvdump.cli:main"

[dependency-groups]
# pycryptodome is pulled in transitively by pywidevine, but the tests import
# Crypto.PublicKey.RSA directly, so declare it explicitly for the test env.
dev = ["pytest>=8", "pycryptodome>=3.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
