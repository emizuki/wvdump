[project]
name = "wvdump"
version = "0.1.0"
description = "Extract Widevine L3 device identity and content keys from Android via Frida"
requires-python = ">=3.11"
dependencies = [
    "frida==17.17.0",
    "pywidevine>=1.8",
    "httpx>=0.27",
    "adbutils>=2.5",
]

[project.scripts]
wvdump = "wvdump.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
